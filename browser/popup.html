<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浏览器下载接管</title>
<link rel="stylesheet" href="popup.css">
<body>
<h1>接管浏览器下载</h1>
<form id="settings">
  <label class="toggle"><input id="enabled" type="checkbox">开启接管（点击下载时交给 LiteFetch）</label>
  <button type="submit">保存</button>
</form>
<p id="host" role="status" aria-live="polite">本机下载器：正在检查…</p>
<p id="status" role="status" aria-live="polite"></p>
<p id="ignored" class="hint" role="status" aria-live="polite"></p>
<details>
  <summary>高级：只在某些站点接管</summary>
  <label for="origins">每行一个站点；留空表示所有站点</label>
  <textarea id="origins" rows="4" spellcheck="false" placeholder="https://example.com"></textarea>
  <p class="hint">登录下载、来源页验证和无法确认的请求仍由浏览器处理。</p>
</details>
<script type="module" src="popup.mjs"></script>
</body>
</html>
